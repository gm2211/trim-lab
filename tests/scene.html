<!doctype html>
<meta charset="utf-8">
<title>Trim Lab scene checks</title>
<style>body{font:14px system-ui;margin:16px;background:#eef2ef;color:#182e36}iframe{width:100%;height:650px;border:1px solid #aabbbd}li{margin:6px 0}.fail{color:#a32825}</style>
<h1>Trim Lab scene checks</h1>
<p>Local WebGL integration checks. No external dependencies.</p>
<ol id="results"></ol>
<p><button onclick="inspectJib(1)">Inspect port jib gear</button> <button onclick="inspectJib(-1)">Inspect starboard jib gear</button> <button onclick="inspectLuff()">Inspect luffing boom</button></p>
<iframe src="../app.html" title="Simulator under test"></iframe>
<script>
const frame=document.querySelector('iframe'), results=document.querySelector('#results');
const check=(name,pass)=>{const li=document.createElement('li');li.textContent=(pass?'PASS: ':'FAIL: ')+name;li.className=pass?'':'fail';results.append(li);};
function inspectJib(side){
  frame.contentWindow.eval(`state.twaSide=1;state.twaC=45;state.jcar=.5;state.sheet=.85;state.trav=0;state.jsheet=.75;state.jsheetw=0;update("jcar");B3.paused=true;tick3D();B3.cam.setTarget(V3(.55,1.02,${side*.70}));B3.cam.lowerRadiusLimit=.4;B3.cam.radius=1.55;B3.cam.alpha=${side>0?2.2:-2.2};B3.cam.beta=.82;B3.scene.render();`);
}
function inspectLuff(){
  frame.contentWindow.eval('state.twaSide=1;state.twaC=0;state.sheet=.45;state.trav=0;state.vang=.15;state.mainhal=.9;update("sheet");if(B3.paused)document.querySelector("#pause3d").click();');
  frame.contentWindow.document.querySelector('[data-view="sails"]').click();
}
frame.onload=async()=>{
  const w=frame.contentWindow;
  try{
    check('Helm starts in 3D without a separate navigation item',w.document.querySelector('#pane-sim.active') && !w.document.querySelector('#helm-3d').hidden && !w.document.querySelector('#tabs [data-tab="view3d"]'));
    const shared=['controls','tiles','coach','fx'].map(id=>w.document.getElementById(id));
    const originalSheet=w.document.querySelector('#sheet').value;
    w.document.querySelector('#sheet').value=63;
    w.document.querySelector('#sheet').dispatchEvent(new w.Event('input'));
    const feedback=w.document.querySelector('#fx').textContent;
    const metrics=w.document.querySelector('#tiles').textContent;
    w.document.querySelector('#helm-mode-2d').click();
    check('2D keeps shared controls, metrics and feedback',shared.every(el=>el.getClientRects().length) && w.document.querySelector('#fx').textContent===feedback && w.document.querySelector('#tiles').textContent===metrics && w.document.querySelector('#sheet').value==='63');
    check('2D hides the canvas and exposes diagrams',w.document.querySelector('#helm-3d').hidden && !w.document.querySelector('#helm-2d').hidden);
    w.eval('showTab("lines");showTab("sim");');
    check('Returning to Helm retains selected view',w.document.querySelector('#helm-mode-2d').getAttribute('aria-selected')==='true');
    w.document.querySelector('#helm-mode-2d').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
    check('Keyboard switches back to 3D with focus and selection',w.document.activeElement.id==='helm-mode-3d' && w.document.querySelector('#helm-mode-3d').getAttribute('aria-selected')==='true' && !w.document.querySelector('#helm-3d').hidden);
    check('3D retains the same shared rows and trim state',shared.every(el=>el===w.document.getElementById(el.id) && el.getClientRects().length) && w.document.querySelector('#fx').textContent===feedback && w.document.querySelector('#sheet').value==='63');
    w.document.querySelector('#sheet').value=originalSheet;
    w.document.querySelector('#sheet').dispatchEvent(new w.Event('input'));
    // Compile the actual bundled shaders and wait for local embedded textures.
    for(let i=0;i<200;i++){
      if(w.eval('B3 && B3.scene.isReady()')) break;
      await new Promise(resolve=>setTimeout(resolve,100));
    }
    check('WebGL scene and all materials ready',w.eval('B3 && B3.scene.isReady()'));
    if(w.matchMedia('(min-width:760px) and (min-height:520px)').matches){
      check('Both Helm views fit metrics and feedback inside desktop viewport',['3d','2d'].every(view=>{
        w.document.querySelector('#helm-mode-'+view).click();
        const top=w.document.querySelector('#tiles').getBoundingClientRect(),bottom=w.document.querySelector('#fx').getBoundingClientRect();
        return top.top>=0 && bottom.bottom<=w.innerHeight && w.document.querySelector('#helm-'+view).getBoundingClientRect().height>100;
      }));
      w.document.querySelector('#helm-mode-3d').click();
    }
    check('No caught render error',!w.document.querySelector('#hud3d').dataset.err);
    check('Eight Blender maps embedded',w.eval('Object.values(window.__MARINE_MATERIALS).flatMap(Object.values).length===8'));
    check('Normal and roughness maps use linear data',w.eval('B3.scene.materials.filter(m=>m.bumpTexture&&m.metallicTexture).every(m=>!m.bumpTexture.gammaSpace&&!m.metallicTexture.gammaSpace)'));
    check('Pulley sheaves exist',w.eval('B3.scene.meshes.filter(m=>m.metadata?.blenderAsset==="block"&&m.metadata.blenderParts.some(p=>p.includes("sheave"))).length>=4'));
    check('Scene imports Blender model geometry',w.eval('BOAT_ASSETS.generator.startsWith("Blender") && B3.scene.meshes.filter(m=>m.metadata?.blenderAsset==="boat").length===BOAT_ASSETS.assets.boat.length'));
    check('Model includes manufactured winches and clutches',w.eval('BOAT_ASSETS.assets.boat.flatMap(a=>a.parts).some(p=>p.includes("Self tailer")) && BOAT_ASSETS.assets.boat.flatMap(a=>a.parts).some(p=>p.includes("Clutch lever"))'));
    check('Wind dye starts enabled with visible finite streak geometry',w.eval('B3.dyeOn && B3.puffs?.isEnabled() && B3.puffPos.every(Number.isFinite) && B3.puffPos.some(v=>v!==0)') && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='true');
    const dyeMesh=w.eval('B3.puffs');
    w.document.querySelector('#dyeBtn').click();
    w.eval('tick3D();');
    check('Wind dye toggle hides particles and updates its state',w.eval('!B3.dyeOn && !B3.puffs.isEnabled() && B3.dyeR===null') && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='false');
    w.document.querySelector('#helm-mode-2d').click();
    w.document.querySelector('#helm-mode-3d').click();
    check('Wind dye stays off across Helm view switches',w.eval('!B3.dyeOn && !B3.puffs.isEnabled()'));
    w.document.querySelector('#dyeBtn').click();
    w.eval('tick3D();');
    w.document.querySelector('#helm-mode-2d').click();
    w.document.querySelector('#helm-mode-3d').click();
    w.eval('tick3D();');
    check('Wind dye restores the same particle mesh and survives view switches',w.eval('B3.dyeOn && B3.puffs.isEnabled() && B3.dyeR!==null') && w.eval('B3.puffs')===dyeMesh && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='true');
    check('Wind dye particles move through the flow field',w.eval('(()=>{const before=B3.pp.slice();stepPuffs(.016);return B3.pp.every(Number.isFinite) && B3.pp.some((v,i)=>v!==before[i]);})()'));
    check('Four tackle falls connect rendered block centers',w.eval('B3.mainSheetFalls.length===4 && B3.mainSheetFalls.flat().every(p=>B3.ropePaths.sheet[0].some(v=>BABYLON.Vector3.Distance(v,p)<.09))'));
    check('Blender and physics share layout anchors',w.eval('JSON.stringify(BOAT_ASSETS.layout)===JSON.stringify(RIG)'));
    check('Traveler sits aft of tiller and crew',w.eval('B3.travCar.position.x<RIG.rudderX && B3.travCar.position.x<-3'));
    check('Solid vang and wooden tiller are imported',w.eval('B3.rigidVang.getChildMeshes().length===2 && B3.scene.getTransformNodeByName("woodenTiller").getChildMeshes().some(m=>m.material.name==="wood")'));
    check('Drawn tackle span matches physics constraint',w.eval('Math.abs(B3.mainSheetFalls.reduce((sum,[a,b])=>sum+BABYLON.Vector3.Distance(a,b),0)/4-mainSheetSpan(B3.boomShow,B3.travCar.position.z))<1e-6'));
    check('Halyard tails hang beside companionway',w.eval('["halyard","jhal","cunn","vang"].every(k=>{const p=B3.ropePaths[k].at(-1).at(-1);return p.x<.25&&p.x>.10&&p.y>.6&&p.y<1.1})'));
    check('Control tails clear both winches including highlighted rope thickness',w.eval(`(()=>{
      return ["halyard","jhal","cunn","vang","outhaul"].every(key=>B3.ropePaths[key].every(path=>path.slice(1).every((b,i)=>{
        const a=path[i];
        return [-1,1].every(side=>Array.from({length:65},(_,j)=>BABYLON.Vector3.Lerp(a,b,j/64)).every(p=>
          p.y<RIG.winchY-.08-.008 || p.y>RIG.winchY+.19+.008 || Math.hypot(p.x-RIG.winchX,p.z-side*RIG.winchZ)>.115+.008));
      })));
    })()`));
    check('All rope paths remain finite',w.eval('Object.values(B3.ropePaths).flat(2).every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z))'));
    if(w.document.querySelector('#pause3d').getAttribute('aria-pressed')!=='true') w.document.querySelector('#pause3d').click();
    const routing=w.eval(`(()=>{
      const saved={...state},ok={single:true,entry:true,exit:true,wrap:true,fairlead:true,lazy:true,finite:true,clearance:true};
      for(const side of [-1,1])for(const car of [0,.5,1])for(const mode of ["normal","backed","wing"]){
        Object.assign(state,saved,{twaSide:side,jcar:car,twaC:mode==="wing"?165:45,jsheet:mode==="wing"?.05:.75,jsheetw:mode==="wing"?.6:mode==="backed"?.9:0});update("jcar");tick3D();
        ok.single&&=B3.tubes.jsheet.length===1&&B3.tubes.jsheetw.length===1;
        const blocks=[B3.jibBlock,B3.lazyBlock];
        B3.jibRoutes.forEach((q,k)=>{
          const dot=(a,b,c)=>{const dx=b.x-a.x,dz=b.z-a.z;return Math.abs((dx*(b.x-c.x)+dz*(b.z-c.z))/Math.hypot(dx,dz)/q.radius);};
          ok.entry&&=dot(q.sheave.at(-1),q.turns[0],q.winch)<1e-5;
          ok.exit&&=dot(q.tail[1],q.tail[0],q.winch)<1e-5;
          ok.wrap&&=q.exitAngle-q.entryAngle>=Math.PI*6&&q.turns.every(p=>Math.abs(Math.hypot(p.x-q.winch.x,p.z-q.winch.z)-q.radius)<1e-8);
          const inverse=blocks[k].computeWorldMatrix(true).clone().invert(),boat=B3.boat.computeWorldMatrix(true);
          ok.fairlead&&=q.sheave.every(p=>{const local=BABYLON.Vector3.TransformCoordinates(BABYLON.Vector3.TransformCoordinates(p,boat),inverse);return Math.abs(local.z)<1e-5&&Math.abs(local.length()-.038)<1e-5;});
          ok.lazy&&=q.loaded?q.prefix.length===1:q.prefix.some(p=>p.x>RIG.mastX+.17);
          ok.finite&&=q.path.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
          const spans=[[q.sheave.at(-1),q.turns[0]],[q.tail[0],q.tail.at(-1)]];
          ok.clearance&&=spans.every(([a,b])=>Array.from({length:101},(_,i)=>BABYLON.Vector3.Lerp(a,b,i/100)).every(p=>Math.hypot(p.x-q.winch.x,p.z-q.winch.z)>=q.radius-1e-7));
        });
      }
      Object.assign(state,saved);update("jcar");tick3D();return ok;
    })()`);
    for(const [key,label] of Object.entries({single:'One continuous path per jib sheet',entry:'Jib sheets enter both winches tangentially',exit:'Jib tails leave both winches tangentially',wrap:'Both winches wrap clockwise without cutting drums',fairlead:'Sheets follow actual swiveling fairlead grooves',lazy:'Only lazy sheet routes around mast and over roof',finite:'Jib routing stays finite across tacks, car travel, backed jib and wing-on-wing',clearance:'Winch leads and tails stay outside drum cylinders'}))check(label,routing[key]);
    w.eval('state.sheet=1; state.trav=1; update("trav"); tick3D();');
    check('Windward boom matches solved negative angle',w.eval('lastR.main.boom<0 && Math.abs(B3.boomShow-lastR.main.boom)<1e-8'));
    check('Blocks follow traveler and jib cars',w.eval('B3.scene.getTransformNodeByName("travelerBlock").parent===B3.travCar && B3.lazyCar.position.z===-B3.jibCar.position.z'));
    const t=w.eval('B3.t');
    w.eval('tick3D();');
    check('Pause freezes simulation clock',w.eval('B3.t')===t);
    w.eval('state.twaSide=-1; update("pos"); tick3D();');
    check('Port tack mirrors boom without losing windward sign',w.eval('Math.abs(B3.boomShow+lastR.main.boom)<1e-8'));
    const rope=w.eval('(()=>{const m=B3.tubes.jsheet[0],uv=m.getVerticesData(BABYLON.VertexBuffer.UVKind);let u=0,v=0;for(let i=0;i<uv.length;i+=2){u=Math.max(u,uv[i]);v=Math.max(v,uv[i+1]);}return {u,v};})()');
    check('Wrapped jib sheet retains circumferential UV and repeats lengthwise',Math.abs(rope.u-1)<1e-6&&rope.v>15);
    for(const name of ['rig','deck','sails','rigging']){
      w.document.querySelector(`[data-view="${name}"]`).click();
      check(name+' camera stays inside zoom limits',w.eval('B3.cam.radius>=B3.cam.lowerRadiusLimit && B3.cam.radius<=B3.cam.upperRadiusLimit'));
      const expected={rig:19,deck:8,sails:12,rigging:4.7}[name];
      check(name+' camera applies the requested distance',Math.abs(w.eval('B3.cam.radius')-expected*Math.max(1,1/w.eval('B3.engine.getAspectRatio(B3.cam)')))<1e-6);
    }
    const dynamics=w.eval(`(()=>{
      const saved={...state},getDelta=B3.engine.getDeltaTime;
      const ok={moves:false,pins:true,gear:true,sheet:true,finite:true,reuse:true,pause:true,highlight:true};
      try{
        Object.assign(state,{twaSide:1,twaC:0,sheet:.45,trav:0,vang:.15,mainhal:.9});update("sheet");tick3D();
        B3.paused=false;B3.engine.getDeltaTime=()=>1000/60;
        let min=Infinity,max=-Infinity,firstTube=null;
        for(let i=0;i<180;i++){
          tick3D();min=Math.min(min,B3.boomShow);max=Math.max(max,B3.boomShow);
          const d=rad(B3.boomShow),foot=RIG.mainFoot*(1-(1-state.outhaul)*.09);
          const clew=V3(RIG.mastX-Math.cos(d)*foot,RIG.boomY+.045,Math.sin(d)*foot);
          ok.pins&&=BABYLON.Vector3.Distance(CLOTH.main.p[CLOTH.main.NC-1],clew)<1e-8;
          ok.gear&&=Math.abs(B3.boomMesh.rotation.y-d)<1e-8&&Math.abs(B3.mainSheetFalls.reduce((sum,[a,b])=>sum+BABYLON.Vector3.Distance(a,b),0)/4-mainSheetSpan(B3.boomShow,B3.travCar.position.z))<1e-6;
          ok.sheet&&=mainSheetSpan(B3.boomShow,B3.travCar.position.z)<=B3.boomLimits.length+1e-8;
          ok.finite&&=CLOTH.main.p.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
          if(i===0)firstTube=B3.tubes.vang[0];else ok.reuse&&=B3.tubes.vang[0]===firstTube;
        }
        ok.moves=max-min>1;
        const angle=B3.boomShow,velocity=B3.boomMotion.velocity,time=B3.t;
        document.querySelector('#pause3d').click();tick3D();tick3D();
        ok.pause=B3.boomShow===angle&&B3.boomMotion.velocity===velocity&&B3.t===time;
        const plainVang=B3.tubes.vang[0];update("vang");tick3D();
        ok.highlight=B3.tubes.vang[0]!==plainVang&&plainVang.isDisposed()&&B3.tubes.vang[0].metadata.radius===.008;
        return {...ok,excursion:max-min};
      }finally{B3.engine.getDeltaTime=getDelta;B3.paused=true;Object.assign(state,saved);update("sheet");tick3D();}
    })()`);
    for(const [key,label] of Object.entries({moves:'Luffing drives visible boom swing',pins:'Sail foot remains attached to moving boom',gear:'Boom and tackle anchors follow every dynamics frame',sheet:'Luffing boom respects paid mainsheet length',finite:'Moving cloth remains finite',reuse:'Moving vang reuses its rope mesh',pause:'Pause freezes boom angle and angular momentum',highlight:'Highlighted rope rebuilds at the wider radius'}))check(label,dynamics[key]);
    check('Luffing excursion measured: '+dynamics.excursion.toFixed(2)+' degrees',dynamics.excursion>1);
    w.document.querySelector('[data-view="rigging"]').click();
    document.title=results.querySelector('.fail')?'FAIL: Trim Lab scene checks':'PASS: Trim Lab scene checks';
  }catch(error){check(error.message,false); document.title='FAIL: Trim Lab scene checks';}
};
</script>
