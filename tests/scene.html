<!doctype html>
<meta charset="utf-8">
<title>Trim Lab scene checks</title>
<style>body{font:14px system-ui;margin:16px;background:#eef2ef;color:#182e36}iframe{width:100%;height:650px;border:1px solid #aabbbd}li{margin:6px 0}.fail{color:#a32825}</style>
<h1>Trim Lab scene checks</h1>
<p>Local WebGL integration checks. No external dependencies.</p>
<ol id="results"></ol>
<p><button onclick="inspectJib(1)">Inspect port jib gear</button> <button onclick="inspectJib(-1)">Inspect starboard jib gear</button> <button onclick="inspectLuff()">Inspect luffing boom</button> <button onclick="inspectJibLuff()">Inspect luffing jib sheets</button> <button onclick="inspectTiller()">Inspect tiller clearance</button> <button onclick="inspectSail(1)">Inspect port sail face</button> <button onclick="inspectSail(-1)">Inspect starboard sail face</button></p>
<p><button onclick="inspectSails(1)">Inspect starboard tack slot</button> <button onclick="inspectSails(-1)">Inspect port tack slot</button></p>
<p><button onclick="inspectGrazing(1)">Inspect grazing jib</button> <button onclick="inspectGrazing(-1)">Inspect opposite grazing jib</button></p>
<p><button onclick="inspectTelltales(1)">Inspect red port yarn</button> <button onclick="inspectTelltales(-1)">Inspect green starboard yarn</button></p>
<p><button onclick="inspectBackstay(0)">Inspect eased backstay</button> <button onclick="inspectBackstay(1)">Inspect tensioned backstay</button></p>
<iframe title="Simulator under test"></iframe>
<script>
const frame=document.querySelector('iframe'), results=document.querySelector('#results');
const check=(name,pass)=>{const li=document.createElement('li');li.textContent=(pass?'PASS: ':'FAIL: ')+name;li.className=pass?'':'fail';results.append(li);};
function inspectTelltales(side){
  frame.style.height='900px';
  frame.contentWindow.eval(`Object.assign(state,{twaSide:1,twaC:55,sheet:.85,jsheet:.7,jsheetw:0,jhal:.9});B3.paused=true;update('jsheet');tick3D();
    const rows=clothRows('jib'),a=rows[5][3],t=rows[5][4].subtract(rows[5][2]).normalize(),u=rows[6][3].subtract(rows[4][3]).normalize();
    const n=BABYLON.Vector3.Cross(u,t).normalize();if(n.z*${side}<0)n.scaleInPlace(-1);
    B3.boat.computeWorldMatrix(true);const world=B3.boat.getWorldMatrix(),target=BABYLON.Vector3.TransformCoordinates(a.add(t.scale(.10)),world),normal=BABYLON.Vector3.TransformNormal(n,world).normalize();
    B3.cam.lowerRadiusLimit=.25;B3.cam.setTarget(target);B3.cam.setPosition(target.add(normal.scale(.85)));B3.engine.resize();B3.scene.render();`);
  frame.scrollIntoView();
}
function inspectJib(side){
  frame.contentWindow.eval(`state.twaSide=1;state.twaC=45;state.jcar=.5;state.sheet=.85;state.trav=0;state.jsheet=.75;state.jsheetw=0;update("jcar");B3.paused=true;tick3D();B3.cam.setTarget(V3(.55,1.02,${side*.70}));B3.cam.lowerRadiusLimit=.4;B3.cam.radius=1.55;B3.cam.alpha=${side>0?2.2:-2.2};B3.cam.beta=.82;B3.scene.render();`);
}
function inspectSail(side){
  frame.style.height='950px';
  frame.contentWindow.eval(`state.twaSide=1;state.twaC=45;state.sheet=.85;state.trav=0;state.jsheet=.75;state.jsheetw=0;update("sheet");B3.paused=true;tick3D();B3.cam.setTarget(V3(-.4,3.6,0));B3.cam.radius=5.2;B3.cam.alpha=${side>0?2.7:-2.7};B3.cam.beta=1.25;B3.engine.resize();B3.scene.render();`);
  frame.scrollIntoView();
}
function inspectGrazing(side){
  frame.style.height='1050px';
  frame.contentWindow.eval(`Object.assign(state,{twaSide:${side},twaC:45,sheet:.85,trav:0,jsheet:.75,jsheetw:0,jhal:.9});B3.paused=true;update('sheet');tick3D();B3.cam.setTarget(V3(.7,5.3,0));B3.cam.radius=5;B3.cam.alpha=${side*2.7};B3.cam.beta=1.45;B3.engine.resize();B3.scene.render();`);
  frame.scrollIntoView();
}
function inspectLuff(){
  frame.contentWindow.eval('state.twaSide=1;state.twaC=0;state.sheet=.45;state.trav=0;state.vang=.15;state.mainhal=.9;update("sheet");if(B3.paused)document.querySelector("#pause3d").click();');
  frame.contentWindow.document.querySelector('[data-view="sails"]').click();
}
function inspectJibLuff(){
  frame.style.height='1050px';
  frame.contentWindow.eval('state.twaSide=1;state.twaC=5;state.sheet=1;state.trav=0;state.jsheet=.3;state.jsheetw=0;state.jhal=.9;update("jsheet");if(B3.paused)document.querySelector("#pause3d").click();');
  frame.contentWindow.eval('B3.cam.setTarget(V3(.85,1.35,0));B3.cam.radius=3.4;B3.cam.alpha=.55;B3.cam.beta=1;B3.engine.resize();');
  frame.scrollIntoView();
}
function inspectTiller(){
  frame.style.height='1000px';
  frame.contentWindow.eval('state.twaSide=1;state.twaC=45;state.sheet=.85;state.trav=0;update("sheet");B3.paused=true;tick3D();B3.cam.setTarget(V3(-2.2,.6,0));B3.cam.lowerRadiusLimit=.4;B3.cam.radius=2.8;B3.cam.alpha=-2.0;B3.cam.beta=.65;B3.scene.render();');
  frame.scrollIntoView();
}
function inspectSails(side){
  Object.assign(frame.contentWindow.document.querySelector('#helm-3d').style,{position:'fixed',inset:'0',width:'100vw',height:'100vh',maxHeight:'none',zIndex:'9999',display:'block'});
  frame.contentWindow.eval(`Object.assign(state,{twaSide:${side},twaC:45,sheet:.45,trav:0,jsheet:1,jsheetw:0,jcar:.5,mainhal:.9,jhal:.55});B3.paused=true;update("sheet");tick3D();B3.cam.setTarget(V3(1.3,3.0,0));B3.cam.lowerRadiusLimit=.4;B3.cam.radius=4.8;B3.cam.alpha=${side>0?1.25:-1.25};B3.cam.beta=.55;B3.scene.render();`);
  frame.scrollIntoView();
}
function inspectBackstay(setting=1,side=1){
  frame.style.height='1050px';
  frame.contentWindow.eval(`Object.assign(state,{twaSide:${side},twaC:45,sheet:.85,trav:0,jsheet:.75,jsheetw:0,mainhal:.9,jhal:.9,backstay:${setting}});B3.paused=true;update('backstay');tick3D();B3.cam.setTarget(V3(1.4,6.1,0));B3.cam.radius=13;B3.cam.alpha=${side>0?Math.PI/2:-Math.PI/2};B3.cam.beta=Math.PI/2;B3.engine.resize();B3.scene.render();`);
  frame.scrollIntoView();
}
frame.onload=async()=>{
  const w=frame.contentWindow;
  try{
    check('Helm starts in 3D without a separate navigation item',w.document.querySelector('#pane-sim.active') && !w.document.querySelector('#helm-3d').hidden && !w.document.querySelector('#tabs [data-tab="view3d"]'));
    const shared=['controls','tiles','fx'].map(id=>w.document.getElementById(id));
    const originalSheet=w.document.querySelector('#sheet').value;
    w.document.querySelector('#sheet').value=63;
    w.document.querySelector('#sheet').dispatchEvent(new w.Event('input'));
    const feedback=w.document.querySelector('#fx').textContent;
    const metrics=w.document.querySelector('#tiles').textContent;
    w.document.querySelector('#helm-mode-2d').click();
    check('2D keeps shared controls, metrics and feedback',shared.every(el=>el.getClientRects().length) && w.document.querySelector('#fx').textContent===feedback && w.document.querySelector('#tiles').textContent===metrics && w.document.querySelector('#sheet').value==='63');
    check('2D hides the canvas and exposes diagrams',w.document.querySelector('#helm-3d').hidden && !w.document.querySelector('#helm-2d').hidden);
    w.eval('showTab("lines");showTab("sim");');
    check('Returning to Helm retains selected view',w.document.querySelector('#helm-mode-2d').getAttribute('aria-selected')==='true');
    w.document.querySelector('#helm-mode-2d').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
    check('Keyboard switches back to 3D with focus and selection',w.document.activeElement.id==='helm-mode-3d' && w.document.querySelector('#helm-mode-3d').getAttribute('aria-selected')==='true' && !w.document.querySelector('#helm-3d').hidden);
    check('3D retains the same shared rows and trim state',shared.every(el=>el===w.document.getElementById(el.id) && el.getClientRects().length) && w.document.querySelector('#fx').textContent===feedback && w.document.querySelector('#sheet').value==='63');
    w.document.querySelector('#sheet').value=originalSheet;
    w.document.querySelector('#sheet').dispatchEvent(new w.Event('input'));
    // Compile the actual bundled shaders and wait for local embedded textures.
    for(let i=0;i<200;i++){
      if(w.eval('B3 && B3.scene.isReady()')) break;
      await new Promise(resolve=>setTimeout(resolve,100));
    }
    check('WebGL scene and all materials ready',w.eval('B3 && B3.scene.isReady()'));
    if(w.matchMedia('(min-width:760px) and (min-height:520px)').matches){
      check('Both Helm views fit metrics and feedback inside desktop viewport',['3d','2d'].every(view=>{
        w.document.querySelector('#helm-mode-'+view).click();
        const top=w.document.querySelector('#tiles').getBoundingClientRect(),bottom=w.document.querySelector('#fx').getBoundingClientRect();
        return top.top>=0 && bottom.bottom<=w.innerHeight && w.document.querySelector('#helm-'+view).getBoundingClientRect().height>100;
      }));
      w.document.querySelector('#helm-mode-3d').click();
    }
    check('Scene renders without throwing',w.eval('(tick3D(),B3.scene.render(),true)'));
    check('Eight Blender maps embedded',w.eval('Object.values(window.__MARINE_MATERIALS).flatMap(Object.values).length===8'));
    check('Normal and roughness maps use linear data',w.eval('B3.scene.materials.filter(m=>m.bumpTexture&&m.metallicTexture).every(m=>!m.bumpTexture.gammaSpace&&!m.metallicTexture.gammaSpace)'));
    check('Pulley sheaves exist',w.eval('B3.scene.meshes.filter(m=>m.metadata?.blenderAsset==="block"&&m.metadata.blenderParts.some(p=>p.includes("sheave"))).length>=4'));
    check('Scene imports Blender model geometry',w.eval('BOAT_ASSETS.generator.startsWith("Blender") && B3.scene.meshes.filter(m=>m.metadata?.blenderAsset==="boat").length===BOAT_ASSETS.assets.boat.length'));
    check('Model includes manufactured winches and clutches',w.eval('BOAT_ASSETS.assets.boat.flatMap(a=>a.parts).some(p=>p.includes("Self tailer")) && BOAT_ASSETS.assets.boat.flatMap(a=>a.parts).some(p=>p.includes("Clutch lever"))'));
    check('Deforming sails contain no coincident triangles',w.eval(`(()=>{
      return [B3.mainSail,B3.jibSail].every(mesh=>{
        const positions=mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind),indices=mesh.getIndices(),seen=new Set();
        for(let i=0;i<indices.length;i+=3){
          const triangle=[0,1,2].map(k=>Array.from(positions.slice(indices[i+k]*3,indices[i+k]*3+3)).map(v=>v.toFixed(5)).join(',')).sort().join('|');
          if(seen.has(triangle)) return false;
          seen.add(triangle);
        }
        return true;
      });
    })()`));
    check('Wind dye starts enabled with visible finite streak geometry',w.eval('B3.dyeOn && B3.puffs?.isEnabled() && B3.puffPos.every(Number.isFinite) && B3.puffPos.some(v=>v!==0)') && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='true');
    const dyeMesh=w.eval('B3.puffs');
    w.document.querySelector('#dyeBtn').click();
    w.eval('tick3D();');
    check('Wind dye toggle hides particles and updates its state',w.eval('!B3.dyeOn && !B3.puffs.isEnabled() && B3.dyeR===null') && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='false');
    w.document.querySelector('#helm-mode-2d').click();
    w.document.querySelector('#helm-mode-3d').click();
    check('Wind dye stays off across Helm view switches',w.eval('!B3.dyeOn && !B3.puffs.isEnabled()'));
    w.document.querySelector('#dyeBtn').click();
    w.eval('tick3D();');
    w.document.querySelector('#helm-mode-2d').click();
    w.document.querySelector('#helm-mode-3d').click();
    w.eval('tick3D();');
    check('Wind dye restores the same particle mesh and survives view switches',w.eval('B3.dyeOn && B3.puffs.isEnabled() && B3.dyeR!==null') && w.eval('B3.puffs')===dyeMesh && w.document.querySelector('#dyeBtn').getAttribute('aria-pressed')==='true');
    check('Wind dye particles move through the flow field',w.eval('(()=>{const before=B3.pp.slice();stepPuffs(.016);return B3.pp.every(Number.isFinite) && B3.pp.some((v,i)=>v!==before[i]);})()'));
    check('Four tackle falls connect rendered block centers',w.eval('B3.mainSheetFalls.length===4 && B3.mainSheetFalls.flat().every(p=>B3.ropePaths.sheet[0].some(v=>BABYLON.Vector3.Distance(v,p)<.09))'));
    check('Blender and physics share layout anchors',w.eval('JSON.stringify(BOAT_ASSETS.layout)===JSON.stringify(RIG)'));
    check('Traveler sits aft of tiller and crew',w.eval('B3.travCar.position.x<RIG.rudderX && B3.travCar.position.x<-3'));
    check('Solid vang and wooden tiller are imported',w.eval('B3.rigidVang.getChildMeshes().length===2 && B3.scene.getTransformNodeByName("woodenTiller").getChildMeshes().some(m=>m.material.name==="wood")'));
    check('Tiller and extension sweep stays aft of mainsheet pedestal with 15 cm clearance',w.eval(`(()=>{
      // Radial envelope covers every steering angle, including both tack limits.
      const forwardLimit=RIG.pedestalX-.19/2-.15;
      return BOAT_ASSETS.assets.tiller.every(mesh=>mesh.positions.every((x,i,p)=>i%3!==0 || RIG.rudderX+Math.hypot(x,p[i+2])<forwardLimit));
    })()`));
    check('Drawn tackle span matches physics constraint',w.eval('Math.abs(B3.mainSheetFalls.reduce((sum,[a,b])=>sum+BABYLON.Vector3.Distance(a,b),0)/4-mainSheetSpan(B3.boomShow,B3.travCar.position.z))<1e-6'));
    check('Halyard tails hang beside companionway',w.eval('["halyard","jhal","cunn","vang"].every(k=>{const p=B3.ropePaths[k].at(-1).at(-1);return p.x<.25&&p.x>.10&&p.y>.6&&p.y<1.1})'));
    check('Control tails clear both winches including highlighted rope thickness',w.eval(`(()=>{
      return ["halyard","jhal","cunn","vang","outhaul"].every(key=>B3.ropePaths[key].every(path=>path.slice(1).every((b,i)=>{
        const a=path[i];
        return [-1,1].every(side=>Array.from({length:65},(_,j)=>BABYLON.Vector3.Lerp(a,b,j/64)).every(p=>
          p.y<RIG.winchY-.08-.008 || p.y>RIG.winchY+.19+.008 || Math.hypot(p.x-RIG.winchX,p.z-side*RIG.winchZ)>.115+.008));
      })));
    })()`));
    check('All rope paths remain finite',w.eval('Object.values(B3.ropePaths).flat(2).every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z))'));
    if(w.document.querySelector('#pause3d').getAttribute('aria-pressed')!=='true') w.document.querySelector('#pause3d').click();
    const routing=w.eval(`(()=>{
      const saved={...state},ok={single:true,entry:true,exit:true,wrap:true,fairlead:true,lazy:true,finite:true,clearance:true};
      for(const side of [-1,1])for(const car of [0,.5,1])for(const mode of ["normal","backed","wing"]){
        Object.assign(state,saved,{twaSide:side,jcar:car,twaC:mode==="wing"?165:45,jsheet:mode==="wing"?.05:.75,jsheetw:mode==="wing"?.6:mode==="backed"?.9:0});update("jcar");tick3D();
        ok.single&&=B3.tubes.jsheet.length===1&&B3.tubes.jsheetw.length===1;
        const blocks=[B3.jibBlock,B3.lazyBlock];
        B3.jibRoutes.forEach((q,k)=>{
          const dot=(a,b,c)=>{const dx=b.x-a.x,dz=b.z-a.z;return Math.abs((dx*(b.x-c.x)+dz*(b.z-c.z))/Math.hypot(dx,dz)/q.radius);};
          ok.entry&&=dot(q.sheave.at(-1),q.turns[0],q.winch)<1e-5;
          ok.exit&&=dot(q.tail[1],q.tail[0],q.winch)<1e-5;
          ok.wrap&&=q.exitAngle-q.entryAngle>=Math.PI*6&&q.turns.every(p=>Math.abs(Math.hypot(p.x-q.winch.x,p.z-q.winch.z)-q.radius)<1e-8);
          const inverse=blocks[k].computeWorldMatrix(true).clone().invert(),boat=B3.boat.computeWorldMatrix(true);
          ok.fairlead&&=q.sheave.every(p=>{const local=BABYLON.Vector3.TransformCoordinates(BABYLON.Vector3.TransformCoordinates(p,boat),inverse);return Math.abs(local.z)<1e-5&&Math.abs(local.length()-.038)<1e-5;});
          ok.lazy&&=q.loaded?q.prefix.length===1:q.prefix.some(p=>p.x>RIG.mastX+.17);
          ok.finite&&=q.path.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
          const spans=[[q.sheave.at(-1),q.turns[0]],[q.tail[0],q.tail.at(-1)]];
          ok.clearance&&=spans.every(([a,b])=>Array.from({length:101},(_,i)=>BABYLON.Vector3.Lerp(a,b,i/100)).every(p=>Math.hypot(p.x-q.winch.x,p.z-q.winch.z)>=q.radius-1e-7));
        });
      }
      Object.assign(state,saved);update("jcar");tick3D();return ok;
    })()`);
    for(const [key,label] of Object.entries({single:'One continuous path per jib sheet',entry:'Jib sheets enter both winches tangentially',exit:'Jib tails leave both winches tangentially',wrap:'Both winches wrap clockwise without cutting drums',fairlead:'Sheets follow actual swiveling fairlead grooves',lazy:'Only lazy sheet routes around mast and over roof',finite:'Jib routing stays finite across tacks, car travel, backed jib and wing-on-wing',clearance:'Winch leads and tails stay outside drum cylinders'}))check(label,routing[key]);
    w.eval('state.sheet=1; state.trav=1; update("trav"); tick3D();');
    check('Windward boom matches solved negative angle',w.eval('lastR.main.boom<0 && Math.abs(B3.boomShow-lastR.main.boom)<1e-8'));
    check('Blocks follow traveler and jib cars',w.eval('B3.scene.getTransformNodeByName("travelerBlock").parent===B3.travCar && B3.lazyCar.position.z===-B3.jibCar.position.z'));
    const t=w.eval('B3.t');
    w.eval('tick3D();');
    check('Pause freezes simulation clock',w.eval('B3.t')===t);
    w.eval('state.twaSide=-1; update("pos"); tick3D();');
    check('Port tack mirrors boom without losing windward sign',w.eval('Math.abs(B3.boomShow+lastR.main.boom)<1e-8'));
    const rope=w.eval('(()=>{const m=B3.tubes.jsheet[0],uv=m.getVerticesData(BABYLON.VertexBuffer.UVKind);let u=0,v=0;for(let i=0;i<uv.length;i+=2){u=Math.max(u,uv[i]);v=Math.max(v,uv[i+1]);}return {u,v};})()');
    check('Wrapped jib sheet retains circumferential UV and repeats lengthwise',Math.abs(rope.u-1)<1e-6&&rope.v>15);
    const rigDynamics=w.eval(`(()=>{
      const saved={...state},paused=B3.paused,cam=B3.cam;
      const camera={target:cam.target.clone(),alpha:cam.alpha,beta:cam.beta,radius:cam.radius,lower:cam.lowerRadiusLimit,upper:cam.upperRadiusLimit};
      const ok={api:true,bends:false,luff:true,forestay:true,backstay:true,mirror:true,finite:true,noLeaks:true,animated:true,pause:true};
      const snapshot=()=>({rig:{...B3.rigShow},mast:B3.mastParts.map(p=>new Float32Array(p.positions)),forestay:B3.standingPaths.forestay.map(p=>p.clone()),shroud:B3.standingPaths['shroud'+tackSign()].map(p=>p.clone()),backstay:B3.backstayPaths.map(path=>path.map(p=>p.clone())),luff:CLOTH.main.p.filter((p,i)=>i%CLOTH.main.NC===0).map(p=>p.clone()),meshes:B3.scene.meshes.length,parts:B3.mastParts.length});
      const set=(side,backstay)=>{Object.assign(state,saved,{twaSide:side,twaC:45,mainhal:.9,jhal:.9,backstay});update('backstay');tick3D();return snapshot();};
      try{
        B3.paused=true;
        const soft=set(1,0),hard=set(1,1);
        ok.api=typeof stepRigDisplay==='function'&&typeof updateStandingRig==='function'&&B3.backstayPaths.length===3;
        let maxDelta=0;for(let p=0;p<soft.mast.length;p++)for(let i=0;i<soft.mast[p].length;i+=3)if(soft.mast[p][i+1]+6>5&&soft.mast[p][i+1]+6<7)maxDelta=Math.max(maxDelta,Math.abs(hard.mast[p][i]-soft.mast[p][i]));
        ok.bends=maxDelta>.01&&hard.rig.mastBend>soft.rig.mastBend&&hard.rig.mastHeadAft>soft.rig.mastHeadAft;
        ok.luff=hard.luff.every((p,row)=>{const y=p.y;return Math.abs(p.x-(RIG.mastX+mastOffsetAt(y,hard.rig)))<1e-7;});
        const fh=hard.forestay.at(-1),expected=RIG.mastX+.03+mastOffsetAt(10.05,hard.rig);ok.forestay=Math.abs(fh.x-expected)<1e-7&&Math.abs(fh.y-10.05)<1e-7;
        const bh=hard.backstay[0][0];ok.backstay=Math.abs(bh.x-(RIG.mastX+mastOffsetAt(10.9,hard.rig)))<1e-7&&B3.tubes.backstay?.length===3;
        tick3D();tick3D();const frozen=snapshot();ok.pause=hard.mast.every((p,j)=>p.every((v,i)=>v===frozen.mast[j][i]));
        const port=set(-1,1);ok.mirror=Math.abs(port.rig.mastHeadAft-hard.rig.mastHeadAft)<1e-12&&hard.forestay.every((p,i)=>Math.abs(p.x-port.forestay[i].x)<1e-7&&Math.abs(p.y-port.forestay[i].y)<1e-7&&Math.abs(p.z+port.forestay[i].z)<1e-7)&&hard.shroud.every((p,i)=>Math.abs(p.x-port.shroud[i].x)<1e-7&&Math.abs(p.y-port.shroud[i].y)<1e-7&&Math.abs(p.z+port.shroud[i].z)<1e-7);
        ok.finite=hard.mast.every(q=>Array.from(q).every(Number.isFinite))&&hard.backstay.flat().every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
        const meshCount=hard.meshes,partCount=hard.parts;for(const side of [1,-1])for(const backstay of [0,1,0,1,0])set(side,backstay);ok.noLeaks=B3.scene.meshes.length===meshCount&&B3.mastParts.length===partCount&&Object.values(B3.standingRig).length===5;
        set(1,0);B3.paused=false;state.backstay=1;update('backstay');tick3D(1/60);
        const first=B3.rigShow.mastBend;
        ok.animated=first>soft.rig.mastBend&&first<hard.rig.mastBend;
        for(let i=0;i<120;i++)tick3D(1/60);
        ok.animated&&=Math.abs(B3.rigShow.mastBend-hard.rig.mastBend)<.0001&&CLOTH.main.p.filter((p,i)=>i%CLOTH.main.NC===0).every(p=>Math.abs(p.x-RIG.mastX-mastOffsetAt(p.y,B3.rigShow))<1e-7);
        state.backstay=0;update('backstay');tick3D(1/60);ok.animated&&=B3.rigShow.mastBend>soft.rig.mastBend&&B3.rigShow.mastBend<hard.rig.mastBend;
        return ok;
      }finally{Object.assign(state,saved);B3.paused=true;update('backstay');tick3D();cam.lowerRadiusLimit=camera.lower;cam.upperRadiusLimit=camera.upper;cam.setTarget(camera.target);cam.alpha=camera.alpha;cam.beta=camera.beta;cam.radius=camera.radius;B3.scene.render();B3.paused=paused;}
    })()`);
    for(const [key,label] of Object.entries({api:'Backstay rig display API is present',bends:'Paused soft→hard backstay visibly bends the mast',luff:'Main luff pins follow the bent mast at every row',forestay:'Forestay endpoint follows the bent masthead',backstay:'Split backstay paths and tubes follow the masthead',mirror:'Both tacks mirror standing rig geometry',finite:'Mast and standing rig vertices remain finite',noLeaks:'Repeated paused backstay changes do not leak meshes',animated:'Tension and easing animate gradually with attached sail luffs',pause:'Paused mast vertices stay frozen after trim update'}))check(label,rigDynamics[key]);
    for(const name of ['rig','bend','deck','sails','rigging']){
      w.document.querySelector(`[data-view="${name}"]`).click();
      check(name+' camera stays inside zoom limits',w.eval('B3.cam.radius>=B3.cam.lowerRadiusLimit && B3.cam.radius<=B3.cam.upperRadiusLimit'));
      const expected={rig:19,bend:13,deck:8,sails:12,rigging:4.7}[name];
      check(name+' camera applies the requested distance',Math.abs(w.eval('B3.cam.radius')-expected*Math.max(1,1/w.eval('B3.engine.getAspectRatio(B3.cam)')))<1e-6);
    }
    const dynamics=w.eval(`(()=>{
      const saved={...state},getDelta=B3.engine.getDeltaTime;
      const ok={moves:false,pins:true,gear:true,sheet:true,finite:true,reuse:true,uvReuse:true,pause:true,highlight:true,stableRoutes:true,movingRoutes:true};
      let originalTube=null;
      try{
        Object.assign(state,{twaSide:1,twaC:0,sheet:.45,trav:0,vang:.15,mainhal:.9});update("sheet");tick3D();
        originalTube=BABYLON.MeshBuilder.CreateTube;
        const tubeCalls={};
        BABYLON.MeshBuilder.CreateTube=(name,...args)=>{
          const match=/^rope_(.+?)(?:\\d+)$/.exec(name);
          if(match) tubeCalls[match[1]]=(tubeCalls[match[1]]||0)+1;
          return originalTube.call(BABYLON.MeshBuilder,name,...args);
        };
        B3.paused=false;B3.engine.getDeltaTime=()=>1000/60;
        let min=Infinity,max=-Infinity,firstTube=null,firstVangUV=null;
        for(let i=0;i<180;i++){
          tick3D();min=Math.min(min,B3.boomShow);max=Math.max(max,B3.boomShow);
          const d=rad(B3.boomShow),foot=RIG.mainFoot*(1-(1-state.outhaul)*.09);
          const clew=V3(RIG.mastX-Math.cos(d)*foot,RIG.boomY+.045,Math.sin(d)*foot);
          ok.pins&&=BABYLON.Vector3.Distance(CLOTH.main.p[CLOTH.main.NC-1],clew)<1e-8;
          ok.gear&&=Math.abs(B3.boomMesh.rotation.y-d)<1e-8&&Math.abs(B3.mainSheetFalls.reduce((sum,[a,b])=>sum+BABYLON.Vector3.Distance(a,b),0)/4-mainSheetSpan(B3.boomShow,B3.travCar.position.z))<1e-6;
          ok.sheet&&=mainSheetSpan(B3.boomShow,B3.travCar.position.z)<=B3.boomLimits.length+1e-8;
          ok.finite&&=CLOTH.main.p.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
          if(i===0){firstTube=B3.tubes.vang[0];firstVangUV=firstTube.getVertexBuffer(BABYLON.VertexBuffer.UVKind);}
          else {ok.reuse&&=B3.tubes.vang[0]===firstTube;ok.uvReuse&&=B3.tubes.vang[0].getVertexBuffer(BABYLON.VertexBuffer.UVKind)===firstVangUV;}
        }
        ok.stableRoutes=['halyard','cunn','trav'].every(key=>!tubeCalls[key]);
        ok.movingRoutes=['vang','jsheet','jsheetw'].every(key=>(tubeCalls[key]||0)>0);
        ok.moves=max-min>1;
        const angle=B3.boomShow,velocity=B3.boomMotion.velocity,time=B3.t;
        document.querySelector('#pause3d').click();tick3D();tick3D();
        ok.pause=B3.boomShow===angle&&B3.boomMotion.velocity===velocity&&B3.t===time;
        const plainVang=B3.tubes.vang[0];update("vang");tick3D();
        ok.highlight=B3.tubes.vang[0]!==plainVang&&plainVang.isDisposed()&&B3.tubes.vang[0].metadata.radius===.008;
        return {...ok,excursion:max-min};
      }finally{if(originalTube) BABYLON.MeshBuilder.CreateTube=originalTube;B3.engine.getDeltaTime=getDelta;B3.paused=true;Object.assign(state,saved);update("sheet");tick3D();}
    })()`);
    for(const [key,label] of Object.entries({moves:'Luffing drives visible boom swing',pins:'Sail foot remains attached to moving boom',gear:'Boom and tackle anchors follow every dynamics frame',sheet:'Luffing boom respects paid mainsheet length',finite:'Moving cloth remains finite',reuse:'Moving vang reuses its rope mesh',uvReuse:'Moving vang keeps its UV vertex buffer',pause:'Pause freezes boom angle and angular momentum',highlight:'Highlighted rope rebuilds at the wider radius',stableRoutes:'Static halyard/cunningham/traveler tubes avoid rebuilds',movingRoutes:'Moving vang and jib-sheet tubes still update'}))check(label,dynamics[key]);
    check('Luffing excursion measured: '+dynamics.excursion.toFixed(2)+' degrees',dynamics.excursion>1);
    const jibDynamics=w.eval(`(()=>{
      const saved={...state},getDelta=B3.engine.getDeltaTime;
      const ok={clew:true,ends:true,length:true,finite:true,wrap:true,pause:true,slackMoves:false};
      let excursion=0,overrun=0,worst=null;
      try{
        B3.engine.getDeltaTime=()=>1000/60;
        for(const side of [-1,1])for(const mode of ['luff','backed','wing']){
          B3.paused=true;
          Object.assign(state,{twaSide:side,twaC:mode==='wing'?165:5,sheet:1,trav:0,jsheet:mode==='wing'?.05:.3,jsheetw:mode==='wing'?.6:mode==='backed'?.9:0,jhal:.9});update('jsheet');tick3D();
          B3.paused=false;let min=Infinity,max=-Infinity,firstMid=null;
          for(let i=0;i<120;i++){
            tick3D();min=Math.min(min,B3.clewShow);max=Math.max(max,B3.clewShow);
            const clew=CLOTH.jib.p[CLOTH.jib.NC-1];
            ok.ends&&=B3.jibRoutes.every(q=>BABYLON.Vector3.Distance(q.path[0],clew)<1e-8);
            ok.clew&&=B3.clewShow>=B3.jibLimits.min-1e-8&&B3.clewShow<=B3.jibLimits.max+1e-8;
            ok.wrap&&=B3.jibRoutes.every(q=>q.turns.every(p=>Math.abs(Math.hypot(p.x-q.winch.x,p.z-q.winch.z)-q.radius)<1e-8));
            for(const [key,span] of Object.entries(B3.jibSpans)){
              const length=span.points.slice(1).reduce((sum,p,j)=>sum+Math.hypot(p.x-span.points[j].x,p.y-span.points[j].y,p.z-span.points[j].z),0);
              if(length-span.length>overrun){overrun=length-span.length;worst={key,mode,side,a:span.endA,b:span.endB,paid:span.length};}
              ok.length&&=length<=span.length+.003;
              ok.finite&&=span.points.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z));
              if(mode==='luff'&&key.startsWith('lazy')){
                if(i===30)firstMid={...span.points[8]};
                if(i>30&&firstMid)ok.slackMoves||=Math.hypot(span.points[8].x-firstMid.x,span.points[8].y-firstMid.y,span.points[8].z-firstMid.z)>.005;
              }
            }
          }
          if(mode==='luff')excursion=Math.max(excursion,max-min);
          const frozen=JSON.stringify([B3.clewShow,B3.jibMotion,B3.jibSpans]);
          document.querySelector('#pause3d').click();tick3D();tick3D();
          ok.pause&&=JSON.stringify([B3.clewShow,B3.jibMotion,B3.jibSpans])===frozen;
        }
        return {...ok,excursion,overrun,worst};
      }finally{B3.engine.getDeltaTime=getDelta;B3.paused=true;Object.assign(state,saved);update('jsheet');tick3D();}
    })()`);
    for(const [key,label] of Object.entries({clew:'Moving jib stays inside active sheet limits on both tacks',ends:'Both jib sheets remain attached to the moving cloth clew',length:'Free sheet spans stay within paid length',finite:'Dynamic sheets remain finite when luffing, backed and wing-on-wing',wrap:'Moving jib sheets preserve winch wraps',pause:'Pause freezes jib clew and free-sheet motion',slackMoves:'Lazy jib sheet moves under wind and gravity'}))check(label,jibDynamics[key]);
    check('Jib luffing excursion: '+jibDynamics.excursion.toFixed(2)+' degrees; max line overrun '+jibDynamics.overrun.toFixed(4)+' m',jibDynamics.excursion>.5&&jibDynamics.overrun<.003);
    if(!jibDynamics.length)check('Overlength span '+JSON.stringify(jibDynamics.worst),false);
    check('Vinyl windows share deforming sail geometry and keep transparent materials',w.eval(`
      [[B3.mainSail,B3.mainWindow],[B3.jibSail,B3.jibWindow]].every(([cloth,window])=>
        window.geometry===cloth.geometry && window.parent===cloth.parent && !window.isPickable &&
        cloth.material.needAlphaTesting() && !cloth.material.needAlphaBlending() &&
        window.material.needAlphaBlending() && !window.material.forceDepthWrite)
    `));
    check('Window texture masks exclude opaque cloth and retain clear vinyl',w.eval(`
      [B3.mainWindow,B3.jibWindow].every(mesh=>{
        const tex=mesh.material.albedoTexture,size=tex.getSize(),data=tex.getContext().getImageData(0,0,size.width,size.height).data;
        let clear=0,vinyl=0;
        for(let i=3;i<data.length;i+=4){if(data[i]>=128)return false;if(data[i]===0)clear++;else vinyl++;}
        return clear>0 && vinyl>0;
      })
    `));
    // Opaque curved fabric must render the same regardless of triangle submission order.
    // The former blended material changed thousands of pixels at these grazing angles.
    const sailPixels=w.eval(`(()=>{
      const saved={...state},paused=B3.paused,cam=B3.cam;
      const camera={target:cam.target.clone(),alpha:cam.alpha,beta:cam.beta,radius:cam.radius};
      const visible=B3.scene.meshes.map(mesh=>[mesh,mesh.isVisible]);
      const gl=B3.engine._gl,width=B3.engine.getRenderWidth(),height=B3.engine.getRenderHeight();
      const snap=()=>{B3.scene.render();const pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);return pixels;};
      const difference=(a,b)=>{let changed=0;for(let i=0;i<a.length;i+=4)if(Math.max(...[0,1,2].map(c=>Math.abs(a[i+c]-b[i+c])))>2)changed++;return changed;};
      const samples=[];
      try{
        B3.paused=true;
        for(const side of [1,-1]){
          Object.assign(state,{twaSide:side,twaC:45,sheet:.85,trav:0,jsheet:.75,jsheetw:0,jhal:.9});update('sheet');tick3D();
          cam.setTarget(V3(.7,5.3,0));cam.radius=5;cam.beta=1.45;
          for(const [mesh,angle] of [[B3.jibSail,2.7],[B3.mainSail,2.9]]){
            cam.alpha=side*angle;
            for(const [m] of visible)m.isVisible=false;
            const empty=snap(),indices=Array.from(mesh.getIndices());
            try{
              mesh.isVisible=true;const before=snap(),reverse=[];
              for(let i=indices.length-3;i>=0;i-=3)reverse.push(indices[i],indices[i+1],indices[i+2]);
              mesh.setIndices(reverse);const after=snap();
              samples.push({sail:mesh.name,side,coverage:difference(empty,before),changed:difference(before,after)});
            }finally{mesh.setIndices(indices);}
          }
        }
        return samples;
      }finally{
        for(const [mesh,isVisible] of visible)mesh.isVisible=isVisible;
        Object.assign(state,saved);update('sheet');tick3D();B3.paused=paused;
        cam.setTarget(camera.target);cam.alpha=camera.alpha;cam.beta=camera.beta;cam.radius=camera.radius;B3.scene.render();
      }
    })()`);
    for(const sample of sailPixels)check(
      sample.sail+' grazing depth order, tack '+sample.side+': '+sample.changed+' changed / '+sample.coverage+' visible pixels',
      sample.coverage>100 && sample.changed<=Math.max(8,sample.coverage*.0005));
    const yarnPixels=w.eval(`(()=>{
      const saved={...state},paused=B3.paused,cam=B3.cam;
      const camera={target:cam.target.clone(),alpha:cam.alpha,beta:cam.beta,radius:cam.radius,lower:cam.lowerRadiusLimit};
      const visible=B3.scene.meshes.map(mesh=>[mesh,mesh.isVisible]);
      const gl=B3.engine._gl,width=B3.engine.getRenderWidth(),height=B3.engine.getRenderHeight();
      const snap=()=>{B3.scene.render();const pixels=new Uint8Array(width*height*4);gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);return pixels;};
      const difference=(a,b)=>{let changed=0;for(let i=0;i<a.length;i+=4)if(Math.max(Math.abs(a[i]-b[i]),Math.abs(a[i+1]-b[i+1]),Math.abs(a[i+2]-b[i+2]))>3)changed++;return changed;};
      const samples=[];
      try{
        B3.paused=true;B3.tt.on=true;
        for(const tack of [1,-1]){
          Object.assign(state,{twaSide:tack,twaC:55,sheet:.85,trav:0,jsheet:.7,jsheetw:0,jhal:.9});update('jsheet');tick3D();
          const rows=clothRows('jib'),a=rows[5][3],t=rows[5][4].subtract(rows[5][2]).normalize(),u=rows[6][3].subtract(rows[4][3]).normalize();
          const port=BABYLON.Vector3.Cross(u,t).normalize();if(port.z<0)port.scaleInPlace(-1);
          B3.boat.computeWorldMatrix(true);const world=B3.boat.getWorldMatrix();
          for(const face of [1,-1]){
            const target=BABYLON.Vector3.TransformCoordinates(a.add(t.scale(.10)),world),normal=BABYLON.Vector3.TransformNormal(port.scale(face),world).normalize();
            cam.lowerRadiusLimit=.25;cam.setTarget(target);cam.setPosition(target.add(normal.scale(.65)));
            for(const [m] of visible)m.isVisible=false;
            B3.jibSail.isVisible=true;
            const near=face>0?B3.tt.red.mesh:B3.tt.grn.mesh,far=face>0?B3.tt.grn.mesh:B3.tt.red.mesh;
            const base=snap();far.isVisible=true;const withFar=snap();far.isVisible=false;near.isVisible=true;const withNear=snap();
            samples.push({tack,face,near:difference(base,withNear),far:difference(base,withFar)});
          }
        }
        return samples;
      }finally{
        for(const [mesh,isVisible] of visible)mesh.isVisible=isVisible;
        Object.assign(state,saved);update('sheet');tick3D();B3.paused=paused;
        cam.lowerRadiusLimit=camera.lower;cam.setTarget(camera.target);cam.alpha=camera.alpha;cam.beta=camera.beta;cam.radius=camera.radius;B3.scene.render();
      }
    })()`);
    for(const sample of yarnPixels)check(
      'Yarn occlusion on tack '+sample.tack+', face '+sample.face+': '+sample.near+' near / '+sample.far+' far pixels',
      sample.near>20 && sample.far<=8);
    w.document.querySelector('[data-view="rigging"]').click();
    document.title=results.querySelector('.fail')?'FAIL: Trim Lab scene checks':'PASS: Trim Lab scene checks';
  }catch(error){check(error.message,false); document.title='FAIL: Trim Lab scene checks';}
};
// Always test the current build, not a cached iframe from the previous run.
frame.src="../app.html?scene-check="+Date.now();
</script>
